name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3072m" >> gradle.properties
          ./gradlew assembleGithubRelease --no-daemon

      - name: Sign APK with Official apksigner (v1, v2, v3)
        run: |
          keytool -genkey -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Flow,O=Android,C=US"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -n 1)
          for f in $(find app/build/outputs/apk -name "*armeabi-v7a*.apk"); do
            echo "Signing $f with apksigner..."
            $APKSIGNER sign --ks release.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "$f"
          done

      - name: Upload Single V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: My-YouTube-v7-App
          path: app/build/outputs/apk/**/app*armeabi-v7a*.apk
